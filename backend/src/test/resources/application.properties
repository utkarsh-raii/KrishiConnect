# Test configuration using in-memory H2 in MySQL compatibility mode
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

app.jwt.secret=test_jwt_secret_key_at_least_32_characters_long_for_security_testing_12345
app.jwt.expiration-ms=3600000

app.admin.name=Test Admin
app.admin.email=admin@test.com
app.admin.password=Admin@1234

app.upload.dir=target/test-uploads
