# ==============================================================================
# KrishiConnect Development Profile (application-dev.properties)
# ==============================================================================
# In-memory H2 database with MySQL compatibility mode for instant local testing
# with zero external database dependencies.

spring.datasource.url=jdbc:h2:mem:krishiconnect_dev;MODE=MySQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# H2 Web Console (Available at http://localhost:5001/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Security & Admin defaults
app.admin.name=FHC Admin
app.admin.email=admin@fhc.com
app.admin.password=${ADMIN_PASSWORD}
